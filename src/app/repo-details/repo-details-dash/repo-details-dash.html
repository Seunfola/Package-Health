<div class="repo-overview-card">
    <h2 class="repo-name">{{ repoName }}</h2>

    <div class="metrics-grid">
        <div class="metric-item">
            <div class="icon-value-wrapper">
                <img [src]="starIconPath" class="metric-icon star-icon" alt="Stars" width="24" height="24">
                <span class="metric-value">{{ stars | numberFormat }}</span>
            </div>
            <span class="metric-label">Stars</span>
        </div>

        <div class="metric-item">
            <div class="icon-value-wrapper">
                <img [src]="forkIconPath" class="metric-icon fork-icon" alt="Forks" width="24" height="24">
                <span class="metric-value">{{ forks | numberFormat }}</span>
            </div>
            <span class="metric-label">Forks</span>
        </div>

        <div class="metric-item">
            <div class="icon-value-wrapper">
                <img [src]="commitIconPath" class="metric-icon commit-icon" alt="Last Commit" width="24" height="24">
                <span class="metric-value">{{ lastCommit }}</span>
            </div>
            <span class="metric-label">Last Commit</span>
        </div>

        <div class="metric-item">
            <div class="icon-value-wrapper">
                <img [src]="checkIconPath" class="metric-icon check-icon" alt="Open Checks" width="24" height="24">
                <span class="metric-value">{{ openChecks | numberFormat }}</span>
            </div>
            <span class="metric-label">Open Checks</span>
        </div>
    </div>
</div>

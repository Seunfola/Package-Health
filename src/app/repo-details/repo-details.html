<div *ngIf="analysisData" class="container">
  <h2 class="page-title">
    Repository Details:
    <span>{{ analysisData.repoName }}</span>
  </h2>

  <app-repo-details-dash [repoName]="analysisData.repoName"
    [stars]="analysisData.stars"
    [forks]="analysisData.forks"
    [lastCommit]="analysisData.lastCommit"
    [openChecks]="analysisData.openChecks"
    [overallHealth]="analysisData.overallHealth">
  </app-repo-details-dash>

  <div class="chart-wrapper-container">
    <app-chart-card title="Commit Activity" subtitle="Monthly commit frequency over the last 12 months.">
      <app-line-chart [lineChartData]="commitData" [lineChartOptions]="commitOptions" [lineChartType]="lineChartType">
      </app-line-chart>
    </app-chart-card>
    
    <app-contribution-graph [data]="analysisData.contributionData || []"></app-contribution-graph>
  </div>

  <div class="additional-components-wrapper">
    <app-security-alerts [securityAlerts]="analysisData.securityAlerts"></app-security-alerts>
    <app-code-quality-metrics [healthMetrics]="analysisData.healthMetrics"></app-code-quality-metrics>
  </div>
</div>

<div *ngIf="!analysisData">
  <div class="no-data-section">
    <p *ngIf="loadError">{{ loadError }}</p>
    <p *ngIf="!loadError">No repository data available. Please analyze a repository first.</p>
    <button routerLink="/">Home</button>
  </div>
</div>

<div class="container">
    <h2 class="page-title">
        Repository Details:
        <span>{{ repoTitle }}</span>
    </h2>

    <app-repo-details-dash [repoName]="repoTitle" [stars]="12450" [forks]="3200" [lastCommit]="'2 days ago'"
        [openChecks]="157">
    </app-repo-details-dash>

    <div class="chart-wrapper-container">
        <app-chart-card [title]="'Contribution Graph'" [subtitle]="'Daily contributions over the past year.'">
            <app-git-graph [data]="contributionData"></app-git-graph>
        </app-chart-card>

        <app-chart-card [title]="'Commit Activity'" [subtitle]="'Monthly commit frequency over the last year.'">
            <app-line-chart [lineChartData]="commitData" [lineChartOptions]="commitOptions"
                [lineChartType]="lineChartType">
            </app-line-chart>
        </app-chart-card>
    </div>
    <div class="additional-components-wrapper">
      <app-security-alerts></app-security-alerts>
      <app-code-quality-metrics></app-code-quality-metrics>
    </div>
</div>

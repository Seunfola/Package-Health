<div *ngIf="analysisData" class="container">
  <h2 class="page-title">
    Repository Details:
    <span>{{ analysisData.repoName }}</span>
  </h2>

  <div *ngIf="analysisData.degraded" class="degraded-banner" role="status">
    <span class="degraded-icon">&#9888;</span>
    <span>
      This analysis used partial data
      <ng-container *ngIf="analysisData.degradedReason">&mdash; {{ analysisData.degradedReason }}</ng-container>.
      The trust score below may be less precise than usual.
    </span>
  </div>

  <app-repo-details-dash [repoName]="analysisData.repoName"
    [stars]="analysisData.stars"
    [forks]="analysisData.forks"
    [lastCommit]="analysisData.lastCommit"
    [openChecks]="analysisData.openChecks"
    [overallHealth]="analysisData.overallHealth">
  </app-repo-details-dash>

  <div class="chart-wrapper-container">
    <app-chart-card title="Commit Activity" subtitle="Monthly commit frequency over the last 12 months.">
      <app-line-chart [lineChartData]="commitData" [lineChartOptions]="commitOptions" [lineChartType]="lineChartType">
      </app-line-chart>
    </app-chart-card>
    
    <app-contribution-graph [data]="analysisData.contributionData || []"></app-contribution-graph>
  </div>

  <div class="additional-components-wrapper">
    <app-security-alerts [securityAlerts]="analysisData.securityAlerts"></app-security-alerts>
    <app-code-quality-metrics [healthMetrics]="analysisData.healthMetrics"></app-code-quality-metrics>
  </div>

  <app-leak-findings [scan]="leakScan" [loading]="leakScanLoading" [error]="leakScanError"></app-leak-findings>

  <app-chart-card title="Dependency Graph" subtitle="Direct dependencies, colored by risk tier.">
    <app-dependency-graph [data]="analysisData.dependencyData"></app-dependency-graph>
  </app-chart-card>
</div>

<div *ngIf="!analysisData" class="no-data-section">
  <app-empty-state-card
    [title]="loadError ? 'Repository analysis is unavailable' : 'Choose a repository to inspect'"
    [message]="loadError || 'Open a repository from the Dashboard to see its health metrics, dependency graph, and remediation guidance.'"
    actionLabel="Open dashboard"
    (action)="returnToDashboard()">
  </app-empty-state-card>
</div>

<main class="auth-required">
  <section class="glass-card auth-required__card">
    <div class="auth-required__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1>Sign in to continue</h1>
    <p>This page is only available to signed-in users. Continue to sign in with an existing account, or create a new one — it only takes a moment.</p>

    <div class="auth-required__actions">
      <button type="button" class="btn-primary" (click)="continue()">Continue</button>
      <button type="button" class="btn-secondary" (click)="goBack()">Go back</button>
    </div>
  </section>
</main>

@if (showLoginModal) {
<div class="modal-overlay" (click)="closeLoginModal()" (keydown.escape)="closeLoginModal()" role="dialog" aria-modal="true" aria-label="Sign in modal">
  <app-auth-login (click)="$event.stopPropagation()" role="document" aria-label="Login card"></app-auth-login>
</div>
}

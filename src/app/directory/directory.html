<div class="directory-container">
  <div class="header-section">
    <h1>Profile Directory</h1>
    <p>Browse other DepVault users on this instance. Email addresses are never shown here.</p>
  </div>

  <div *ngIf="isLoading" class="directory__list" aria-hidden="true">
    <div class="directory__row" *ngFor="let i of [1, 2, 3, 4, 5]">
      <app-skeleton width="44px" height="44px" [circle]="true"></app-skeleton>
      <div class="directory__info directory__info--grow">
        <app-skeleton width="140px" height="14px"></app-skeleton>
        <app-skeleton width="90px" height="12px"></app-skeleton>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && error" class="state-viewport">
    <app-error-state-card
      title="Directory unavailable"
      [message]="error"
      (retry)="load()">
    </app-error-state-card>
  </div>

  <div *ngIf="!isLoading && !error && profiles.length === 0" class="state-viewport">
    <app-empty-state-card
      title="No profiles yet"
      message="Once other users are on this DepVault instance, they'll show up here.">
    </app-empty-state-card>
  </div>

  <div *ngIf="!isLoading && profiles.length > 0" class="directory__list">
    <div *ngFor="let profile of profiles" class="directory__row">
      <img
        [src]="profile.profile_picture_url || 'assets/icons/user.svg'"
        alt=""
        class="directory__avatar"
      />
      <div class="directory__info">
        <span class="directory__name">{{ profile.name || profile.username }}</span>
        <span class="directory__username">&#64;{{ profile.username }}</span>
        <span *ngIf="profile.bio" class="directory__bio">{{ profile.bio }}</span>
      </div>
    </div>
  </div>

  @if (hasMore) {
    <div class="directory__load-more">
      <button (click)="loadMore()" [disabled]="isLoadingMore" class="save-button">
        {{ isLoadingMore ? 'Loading...' : 'Load more' }}
      </button>
    </div>
  }
</div>

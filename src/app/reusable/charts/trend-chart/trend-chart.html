<div class="trend-container">
  <h3>30-Day Trust Score Trend</h3>
  <div class="svg-container">
    <svg viewBox="0 0 300 100" class="sparkline" *ngIf="history.length > 0">
      <defs>
        <linearGradient id="trendGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4ade80" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
        </linearGradient>
      </defs>
      <polyline
        [attr.points]="points"
        fill="none"
        stroke="#4ade80"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Fill area under the curve -->
      <polygon
        [attr.points]="'0,100 ' + points + ' 300,100'"
        fill="url(#trendGradient)"
      />
    </svg>
    <div *ngIf="history.length === 0" class="no-data">
      No historical data available yet.
    </div>
  </div>
</div>

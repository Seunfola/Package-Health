<section class="empty-state glass-card" aria-live="polite">
  <div class="empty-state__icon" aria-hidden="true">⌁</div>
  <h2>{{ title() }}</h2>
  <p>{{ message() }}</p>
  @if (actionLabel()) { <button class="btn-primary" type="button" (click)="action.emit()">{{ actionLabel() }}</button> }
</section>

<footer class="footer-root">
    <div class="footer-container">
        <div class="footer-grid">
            <div class="footer-brand">
                <h3 class="brand-title">PackageHealth</h3>
                <p class="brand-tagline">
                    Tracking repository health and performance across your enterprise.
                </p>

                <div class="social-icons">
                    <a href="#" class="social-link" aria-label="GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M15 22V18a4 4 0 0 0-1-3.75c2.75-.41 5.5-1.35 5.5-6a4.12 4.12 0 0 0-1.58-3.26 4.07 4.07 0 0 0-.06-3.23s-1.12-.33-3.53 1.25a12 12 0 0 0-6 0c-2.41-1.58-3.53-1.25-3.53-1.25a4.07 4.07 0 0 0-.06 3.23A4.12 4.12 0 0 0 4 8c0 4.65 2.75 5.59 5.5 6a4 4 0 0 0-1 3.75v4">
                            </path>
                        </svg>
                    </a>
                    <a href="#" class="social-link" aria-label="LinkedIn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                            <rect x="2" y="9" width="4" height="12" />
                            <circle cx="4" cy="4" r="2" />
                        </svg>
                    </a>
                    <a href="#" class="social-link" aria-label="Twitter">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.4 1.3 1.2 2.6 1.8 4 1.8 4.7 0 8.5-3.8 8.5-8.5v-.5c.8-.5 1.5-1.3 2-2.3z" />
                        </svg>
                    </a>
                </div>
            </div>

            @for (col of footerLinks; track $index) {
            <div class="footer-nav-column">
                <h4 class="nav-title">{{ col.title }}</h4>
                <ul class="nav-list">
                    @for (link of col.links; track $index) {
                    <li>
                        <a href="#" class="nav-link">{{ link }}</a>
                    </li>
                    }
                </ul>
            </div>
            }

        </div>

        <div class="footer-copyright">
            <p class="copyright-text">
                &copy; {{ currentYear }} PackageHealth. All rights reserved.
            </p>
        </div>
    </div>
</footer>

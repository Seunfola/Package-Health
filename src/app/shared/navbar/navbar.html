<header class="navbar">
  <div class="navbar__logo">
    <img src="assets/icons/logo.svg" alt="logo" />
  </div>

  <div class="navbar__center">
    <div class="search-input-container">
      <img src="assets/icons/search.svg" alt="search icon" class="search-icon" />
      <input type="text" class="search-input" placeholder="Search for repositories, packages, or users">
    </div>
  </div>

  <div class="navbar__actions">
    <div class="mobile-search">
      <div class="search-input-container">
        <img src="assets/icons/search.svg" alt="search icon" class="search-icon" />
        <input type="text" class="search-input" placeholder="Search..." />
      </div>
    </div>

    <div class="avatar">
      <img src="assets/images/B1.jpg" alt="User Avatar" />
    </div>
  </div>

  <button class="menu-toggle" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
</header>

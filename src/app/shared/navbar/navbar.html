<header class="navbar">
    <div class="navbar__logo">
        <!-- <img src="assets/logo.svg" alt="PackageHealth Logo" class="logo-icon" /> -->
        <span class="logo-text">PackageHealth</span>
    </div>

    <nav class="navbar__menu">
        <a routerLink="/home" routerLinkActive="active">Home</a>
        <a routerLink="/repositories" routerLinkActive="active">Repositories</a>
        <a routerLink="/notifications" routerLinkActive="active">Notifications</a>
    </nav>

    <div class="navbar__actions">
        <button class="search-btn" aria-label="Search">
            <!-- Restored inline SVG for guaranteed rendering of the search icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 5.64 5.64a7.5 7.5 0 0 0 10.61 10.61Z" />
            </svg>
        </button>
        <div class="avatar">
            <img src="assets/images/B1.jpg" alt="User Avatar" />
        </div>
    </div>

    <button class="menu-toggle" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
</header>

<header class="navbar">
  <div class="navbar__logo">
    <img ngSrc="assets/icons/depvault-logo.png" alt="DepVault logo" width="40" height="30" priority />
    @if (orgLogoUrl) {
      <img [src]="orgLogoUrl" alt="Organization logo" class="navbar__org-logo" />
    }
  </div>

  <nav class="navbar__links">
    <a routerLink="/features" class="nav-link">Features</a>
    <a routerLink="/pricing" class="nav-link">Pricing</a>
    <a routerLink="/docs" class="nav-link">Docs</a>
    <a routerLink="/how-it-works" class="nav-link">How It Works</a>
  </nav>

  <div class="navbar__center">
    <div class="search-input-container">
      <img ngSrc="assets/icons/search.svg" alt="search icon" class="search-icon" width="20" height="20" />
      <input type="text" class="search-input" placeholder="Search for repositories, packages, or users">
    </div>
  </div>

  <div class="navbar__actions">
    <div class="mobile-search">
      <div class="search-input-container">
        <img ngSrc="assets/icons/search.svg" alt="search icon" class="search-icon" width="20" height="20" />
        <input type="text" class="search-input" placeholder="Search..." />
      </div>
    </div>

    @if ((authState$ | async)?.isAuthenticated) {
      <div class="user-menu">
        <button
          type="button"
          class="avatar avatar--placeholder"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="showUserMenu"
          aria-label="Account menu"
        >
          <img ngSrc="assets/icons/user.svg" alt="" width="20" height="20" />
        </button>
        @if (showUserMenu) {
          <div class="user-menu__backdrop" (click)="closeUserMenu()"></div>
          <div class="user-menu__dropdown" role="menu">
            <p class="user-menu__name">{{ (authState$ | async)?.username || 'Signed in' }}</p>
            <a routerLink="/home" class="user-menu__item" (click)="closeUserMenu()">DepVault.com</a>
            <a routerLink="/user-profile" class="user-menu__item" (click)="closeUserMenu()">Profile</a>
            <a routerLink="/dashboard-settings" class="user-menu__item" (click)="closeUserMenu()">Settings</a>
            <button type="button" class="user-menu__item user-menu__item--logout" (click)="onLogout()">Log out</button>
          </div>
        }
      </div>
    } @else {
    <button class="avatar avatar--placeholder" (click)="openLoginModal()" aria-label="Open Login">
      <img ngSrc="assets/icons/user.svg" alt="User Icon" width="20" height="20" />
    </button>
    }
  </div>

  <button class="menu-toggle" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
</header>

@if (showLoginModal) {
<div class="modal-overlay" (click)="closeLoginModal()" (keydown.escape)="closeLoginModal()" role="dialog" aria-modal="true" aria-label="Login modal">
  <app-auth-login (click)="$event.stopPropagation()" role="document" aria-label="Login card"></app-auth-login>
</div>
}

<aside [class]="sidebar()">
  <ul [class]="list()">
    @for (item of menuItems; track $index) {
      <li
        [class]="listItem({ active: activeIndex === $index })"
        (click)="setActive($index)"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeIndex === $index"
        (keydown.enter)="setActive($index)"
      >
        <img
          [src]="'assets/icons/' + item.icon + '.svg'"
          [attr.alt]="item.label"
          [attr.title]="item.label"
          width="24"
          height="24"
        />
        <span class="text-neutral-200 font-medium">{{ item.label }}</span>
      </li>
      <div class="w-full h-px bg-neutral-700 my-3"></div>
    }
  </ul>
</aside>

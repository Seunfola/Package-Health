<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Log In</h2>
      <p>Continue with your preferred service.</p>
    </div>
    <div class="login-buttons">
      <button class="login-button github" (click)="loginWithGithub()">
        <img src="assets/icons/git.svg" alt="GitHub icon" class="icon">
        <span>Continue with GitHub</span>
      </button>
      <button class="login-button google" (click)="loginWithGoogle()">
        <img src="assets/icons/chrome.svg" alt="Chrome icon" class="icon">
        <span>Continue with Google</span>
      </button>
    </div>
  </div>
</div>

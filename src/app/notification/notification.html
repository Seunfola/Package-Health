<div class="notifications-center-container">
  <div class="notifications-header">
    <div class="header-text">
      <h2>Notifications Center</h2>
      <p>Manage your alerts and updates across all monitored repositories.</p>
    </div>
  <div class="header-actions">
    <div class="filter-buttons">
      <button class="filter-button active">All (7)</button>
      <button class="filter-button">Unread (3)</button>
      <button class="filter-button">Archived (4)</button>
      <button class="filter-button">Security</button>
    </div>

    <div class="action-buttons">
      <a href="#" class="settings-link">Go to Notification Settings</a>
      <button class="updates-button">Updates</button>
      <button class="mark-as-read-button">Mark all as read</button>
    </div>
  </div>

  </div>

  <div class="notifications-list">
    @for (notification of notifications; track notification.title) {
    <app-notification-item [type]="notification.type" [title]="notification.title"
      [repository]="notification.repository" [time]="notification.time" [iconType]="notification.iconType"></app-notification-item>
    }
  </div>
</div>

<div class="repo-health-container">
    <div class="header-section">
        <h1>Repository Health Dashboard</h1>
        <p>Overview of health metrics for PackageHealth/package-analyzer.</p>
    </div>

    <div class="metrics-grid">
        @for (card of statusCards; track card.title) {
        <app-status-card [title]="card.title" [value]="card.value" [icon]="card.icon" [iconContainerBg]="card.iconContainerBg"
          [iconFillColor]="card.iconFillColor" [cardBorderRadius]="card.cardBorderRadius"></app-status-card>
        }

    </div>

  <div class="performance-trends">
        <h2>Performance Trends</h2>
    <section class="charts-container">
        <app-commit-activity-chart></app-commit-activity-chart>
        <app-issue-resolution-chart></app-issue-resolution-chart>
        <app-dependency-update-chart></app-dependency-update-chart>
    </section>
  </div>

</div>

<section class="updates-campaign-section" id="features">
  <div class="updates-campaign-header">
    <div class="section-eyebrow">Why DepVault</div>
    <h2 class="section-heading">Built for Real Dependency Risk</h2>
    <div class="section-divider"></div>
  </div>

  <div class="updates-grid">
    <div class="updates-col left">
      <app-package-health-card [feature]="features[0]"></app-package-health-card>
      <div class="glass-card small">
        <div class="card-content">
          <h3>{{ smallFeatures[0].title }}</h3>
          <p>{{ smallFeatures[0].description }}</p>
        </div>
      </div>
    </div>

    <div class="updates-col middle">
      <app-package-health-card [feature]="features[1]"></app-package-health-card>
      <app-package-health-card [feature]="features[2]"></app-package-health-card>
    </div>

    <div class="updates-col right">
      <app-package-health-card [feature]="features[3]"></app-package-health-card>
      <div class="glass-card small">
        <div class="card-content">
          <h3>{{ smallFeatures[1].title }}</h3>
          <p>{{ smallFeatures[1].description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

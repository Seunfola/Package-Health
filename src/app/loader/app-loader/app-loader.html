<div class="loading-screen" *ngIf="progress > 0 && progress < 100">
  <div class="logo-wrapper">
    <img ngSrc="assets/icons/logo.svg" alt="logo" width="100" height="100" />
  </div>
<div class="progress-container" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100"
  [attr.aria-valuenow]="progress">
  <div class="progress-fill">
    <div class="liquid-wave" [style.width.%]="progress"></div>
  </div>
</div>
  <p class="progress-text">{{ progress }}%</p>
  </div>

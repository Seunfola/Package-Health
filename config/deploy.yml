# Name of your application. Used to uniquely configure containers.
service: package-health

# Name of the container image.
image: seunts/package-health

# Deploy to these servers.
servers:
  web:
    - 172.22.16.1

  ports:
    - "3000:3000"   # host_port:container_port

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
proxy:
  ssl: true
  host: pacackgehealth.duckdns.org

# Credentials for your image host (Docker login will handle authentication).
registry:
  username: seunts
  # Remove password; use environment variable or manual docker login instead
password:
    secret: KAMAL_REGISTRY_PASSWORD
# Configure builder setup.
builder:
  arch: amd64

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# env:

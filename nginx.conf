# Redirect all HTTP traffic to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
  # Permanent redirect to HTTPS
  return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name _;

  # SSL certificates (replace with your actual paths)
  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  # Modern TLS setup
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5';
  ssl_prefer_server_ciphers on;  # Only affects TLS 1.2 and below
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Root and index
  root /usr/share/nginx/html;
  index index.html;

  # 🔒 Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # TODO: Remove 'unsafe-inline' and implement nonce-based CSP for better XSS protection
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:;" always;

  # Reverse-proxy the backend so the frontend can call same-origin relative
  # paths (/api/..., /auth/...) instead of the browser needing to resolve
  # `depvault-api` — that hostname only exists on the compose network, not
  # from the browser, and the CSP above (`default-src 'self'`) would block a
  # direct cross-origin call to it even if DNS somehow worked. Proxying here
  # keeps environment.prod.ts's default (see Dockerfile) same-origin and
  # avoids needing CORS configuration on the backend for the standard
  # docker-compose deployment.
  location /api/ {
    proxy_pass http://depvault-api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://depvault-api:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular SPA routing support
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gzip compression (optional but recommended)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 256;

}
